name: Build Windows VST3

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target ChengFlower_VST3 --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ChengFlower-VST3-Windows-x64
          path: build/ChengFlower_artefacts/Release/VST3/
